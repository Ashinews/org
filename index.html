<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معرفی پکیج</title>

<!-- فونت آیکون -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:tahoma;
}

body{
    background:#0f172a;
    color:white;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.hero{
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:3rem;
    margin-bottom:15px;
}

.hero p{
    color:#cbd5e1;
    font-size:1.1rem;
}

.video-section{
    margin-top:40px;
}

.video-container{
    position:relative;
    width:100%;
    padding-bottom:56.25%;
    overflow:hidden;
    border-radius:20px;
    box-shadow:0 0 25px rgba(0,255,255,.3);
}

.video-container iframe,
.video-container video{
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
}

.features{
    margin-top:50px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    padding:25px;
    border-radius:15px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.price-box{
    margin-top:50px;
    text-align:center;
    background:#1e293b;
    padding:30px;
    border-radius:20px;
}

.price{
    font-size:3rem;
    color:#22c55e;
    margin:15px 0;
}

.buy-btn{
    display:inline-block;
    background:#22c55e;
    color:white;
    text-decoration:none;
    padding:15px 40px;
    border-radius:12px;
    font-size:18px;
}

.socials{
    margin-top:50px;
    text-align:center;
}

.socials a{
    color:white;
    font-size:35px;
    margin:0 15px;
    transition:.3s;
}

.socials a:hover{
    color:#38bdf8;
}

footer{
    text-align:center;
    margin-top:60px;
    padding:20px;
    color:#94a3b8;
}

/* موبایل */
@media(max-width:768px){

.hero h1{
    font-size:2rem;
}

.price{
    font-size:2.2rem;
}

.buy-btn{
    width:100%;
}

}

</style>
</head>
<body>

<div class="container">

    <section class="hero">
        <h1>پکیج حرفه‌ای آموزش</h1>
        <p>کامل‌ترین دوره برای رسیدن به نتیجه واقعی</p>
    </section>

    <!-- ویدیو -->
    <section class="video-section">

        <!-- اگر ویدیو یوتیوب داری -->
        <div class="video-container">
            <iframe
            src="https://www.youtube.com/embed/YOUR_VIDEO_ID"
            frameborder="0"
            allowfullscreen>
            </iframe>
        </div>

        <!-- یا فایل ویدیو -->
        <!--
        <div class="video-container">
            <video controls>
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>
        -->

    </section>

    <!-- مزایا -->
    <section class="features">

        <div class="card">
            <h3>آموزش کامل</h3>
            <p>از صفر تا صد به صورت پروژه محور</p>
        </div>

        <div class="card">
            <h3>پشتیبانی</h3>
            <p>پاسخ به سوالات و رفع اشکال</p>
        </div>

        <div class="card">
            <h3>آپدیت رایگان</h3>
            <p>دریافت نسخه‌های جدید بدون هزینه</p>
        </div>

    </section>

    <!-- قیمت -->
    <section class="price-box">
        <h2>قیمت پکیج</h2>
        <div class="price">499,000 تومان</div>

        <a href="#" class="buy-btn">
            خرید پکیج
        </a>
    </section>

    <!-- شبکه های اجتماعی -->
    <section class="socials">

        <a href="https://youtube.com/@YOUR_ID" target="_blank">
            <i class="fab fa-youtube"></i>
        </a>

        <a href="https://t.me/YOUR_ID" target="_blank">
            <i class="fab fa-telegram"></i>
        </a>

        <a href="https://instagram.com/YOUR_ID" target="_blank">
            <i class="fab fa-instagram"></i>
        </a>

    </section>

    <footer>
        تمامی حقوق محفوظ است
    </footer>

</div>

</body>
</html>
