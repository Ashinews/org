
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ashibaba | خدمات ایرانیان خارج از کشور در تهران</title>
  <meta name="description" content="Ashibaba، همراه مطمئن ایرانیان خارج از کشور برای انجام امور اداری، تهیه و خرید کالا، پیگیری درخواست‌ها و خدمات حضوری در تهران، بدون نیاز به حضور شما در ایران.">
  <meta name="keywords" content="آشی بابا, Ashibaba, خدمات ایرانیان خارج از کشور, انجام امور اداری در تهران, خرید کالا از ایران, ارسال کالا به خارج از کشور, خدمات ایرانیان مقیم خارج">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#101c30">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Ashibaba | ایران، نزدیک‌تر از همیشه">
  <meta property="og:description" content="کارهای شما در ایران، با همراهی ما. خدمات اداری، خرید و تهیه کالا و پیگیری امور در تهران.">
  <meta property="og:locale" content="fa_IR">

  <!-- فونت فارسی -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #101c30;
      --navy-light: #192b43;
      --gold: #d7b77b;
      --gold-light: #f0dfb7;
      --cream: #faf8f3;
      --white: #ffffff;
      --text: #293449;
      --muted: #788294;
      --border: #eae6dd;
      --radius: 22px;
      --shadow: 0 18px 55px rgba(16, 28, 48, .07);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 35px;
    }

    body {
      font-family: "Vazirmatn", Tahoma, sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 2;
      overflow-wrap: anywhere;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1160px, calc(100% - 48px));
      margin-inline: auto;
    }

    .top-line {
      height: 4px;
      background: linear-gradient(
        90deg,
        var(--navy),
        var(--gold),
        var(--navy)
      );
    }

    /* Header */

    header {
      background: rgba(250, 248, 243, .96);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: var(--navy);
      color: var(--gold);
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: 700;
      box-shadow: 0 7px 18px rgba(16, 28, 48, .15);
    }

    .brand-name {
      font-family: Georgia, "Vazirmatn", serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -.8px;
      line-height: 1.3;
    }

    .brand-subtitle {
      display: block;
      font-family: "Vazirmatn", sans-serif;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1.1px;
      margin-top: 4px;
    }

    .header-note {
      color: #697486;
      font-size: 13px;
      font-weight: 500;
    }

    /* Hero */

    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at 12% 15%,
          rgba(215, 183, 123, .13),
          transparent 35%
        ),
        linear-gradient(125deg, #101c30 0%, #172940 58%, #20354b 100%);
      color: white;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      border: 1px solid rgba(215, 183, 123, .17);
      border-radius: 50%;
      top: -210px;
      left: -100px;
      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 270px;
      height: 270px;
      border: 1px solid rgba(215, 183, 123, .13);
      border-radius: 50%;
      bottom: -180px;
      right: 15%;
      pointer-events: none;
    }

    .hero-inner {
      min-height: 550px;
      padding-block: 90px;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      align-items: center;
      gap: 70px;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .5px;
      margin-bottom: 25px;
    }

    .eyebrow::before {
      content: "";
      width: 30px;
      height: 1px;
      background: var(--gold);
    }

    h1 {
      font-size: clamp(32px, 4.1vw, 55px);
      font-weight: 800;
      line-height: 1.65;
      letter-spacing: -1.4px;
      max-width: 700px;
    }

    h1 span {
      color: var(--gold);
      white-space: normal;
    }

    .hero-description {
      max-width: 610px;
      margin-top: 23px;
      color: #c5ced9;
      font-size: 15px;
      font-weight: 300;
      line-height: 2.5;
    }

    .hero-note {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 32px;
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 500;
    }

    .hero-note span {
      display: inline-block;
      height: 1px;
      width: 36px;
      background: var(--gold);
    }

    /* Decorative emblem */

    .hero-visual {
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    .emblem {
      width: min(310px, 100%);
      aspect-ratio: 1;
      border: 1px solid rgba(215, 183, 123, .48);
      border-radius: 50%;
      padding: 19px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .emblem::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(215, 183, 123, .22);
      border-radius: 50%;
    }

    .emblem-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 25%, #2c4056, #142238 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .emblem-symbol {
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 88px;
      font-weight: 700;
      line-height: 1.2;
    }

    .emblem-name {
      font-family: Georgia, serif;
      color: #fff;
      font-size: 29px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: 8px;
    }

    .emblem-caption {
      color: var(--gold-light);
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 12px;
    }

    /* Trust strip */

    .trust-strip {
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .trust-inner {
      min-height: 105px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
    }

    .trust-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      padding: 20px 12px;
      text-align: right;
    }

    .trust-item + .trust-item {
      border-right: 1px solid var(--border);
    }

    .trust-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: #f6f1e7;
      color: #9b7840;
      display: grid;
      place-items: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .trust-item strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
    }

    .trust-item small {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Section defaults */

    section {
      scroll-margin-top: 30px;
    }

    .section {
      padding-block: 100px;
    }

    .section-heading {
      max-width: 700px;
      margin-bottom: 48px;
    }

    .section-label {
      display: inline-block;
      color: #a27d43;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .4px;
      margin-bottom: 13px;
    }

    h2 {
      color: var(--navy);
      font-size: clamp(25px, 3vw, 37px);
      line-height: 1.8;
      font-weight: 800;
      letter-spacing: -.6px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 14px;
      line-height: 2.5;
      margin-top: 13px;
    }

    /* Services */

    .services {
      background: var(--cream);
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .service-card {
      padding: 32px 28px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
      min-width: 0;
    }

    .service-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
      border-color: #ddc89f;
    }

    .service-number {
      display: inline-block;
      color: #b69a68;
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 1px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e7d8bb;
      min-width: 38px;
    }

    .service-icon {
      width: 54px;
      height: 54px;
      border-radius: 17px;
      background: #f7f2e8;
      display: grid;
      place-items: center;
      font-size: 24px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .service-card h3 {
      color: var(--navy);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.9;
      margin-bottom: 12px;
    }

    .service-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 2.4;
    }

    /* About */

    .about {
      background: white;
      border-block: 1px solid var(--border);
    }

    .about-grid {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 85px;
      align-items: center;
    }

    .about-visual {
      min-height: 390px;
      padding: 35px;
      border-radius: 28px;
      background:
        radial-gradient(circle at 85% 15%, rgba(215,183,123,.14), transparent 38%),
        var(--navy);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .about-visual::before {
      content: "";
      position: absolute;
      width: 270px;
      height: 270px;
      border: 1px solid rgba(215,183,123,.23);
      border-radius: 50%;
      top: -100px;
      left: -100px;
    }

    .about-visual .big-number {
      font-family: Georgia, serif;
      color: var(--gold);
      font-size: clamp(45px, 5vw, 72px);
      font-weight: 700;
      line-height: 1.4;
      position: relative;
    }

    .about-visual h3 {
      color: white;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.9;
      position: relative;
      margin-top: 12px;
    }

    .about-visual p {
      color: #c2ccda;
      font-size: 13px;
      line-height: 2.5;
      position: relative;
      margin-top: 14px;
    }

    .about-content h2 {
      margin-bottom: 20px;
    }

    .about-content > p {
      color: var(--muted);
      font-size: 14px;
      line-height: 2.7;
      margin-bottom: 16px;
    }

    .feature-list {
      list-style: none;
      display: grid;
      gap: 17px;
      margin-top: 28px;
    }

    .feature-list li {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      color: #3e4a5d;
      font-size: 13px;
      line-height: 2.2;
    }

    .check {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      margin-top: 3px;
      border-radius: 50%;
      background: #f3ead8;
      color: #8f6e37;
      font-size: 12px;
      font-weight: 800;
    }

    /* Process */

    .process {
      background: #f6f3ec;
    }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 32px;
      margin-top: 15px;
    }

    .process-step {
      padding: 30px 25px;
      background: rgba(255,255,255,.7);
      border: 1px solid #e9e2d4;
      border-radius: 20px;
    }

    .step-number {
      font-family: Georgia, serif;
      font-size: 35px;
      color: #b69a68;
      line-height: 1.4;
      margin-bottom: 17px;
    }

    .process-step h3 {
      color: var(--navy);
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .process-step p {
      color: var(--muted);
      font-size: 13px;
      line-height: 2.5;
    }

    /* Promise */

    .promise {
      padding-block: 80px;
      background: white;
    }

    .promise-inner {
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 45px 55px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
      align-items: center;
    }

    .promise h2 {
      font-size: clamp(23px, 2.6vw, 32px);
    }

    .promise p {
      color: var(--muted);
      font-size: 13px;
      line-height: 2.6;
      margin-top: 13px;
    }

    .promise-quote {
      border-right: 2px solid var(--gold);
      padding-right: 25px;
      color: #4c586a;
      font-size: 15px;
      line-height: 2.6;
    }

    .promise-quote strong {
      display: block;
      color: var(--navy);
      font-size: 13px;
      margin-top: 14px;
    }

    /* Footer */

    footer {
      background: var(--navy);
      color: white;
      padding-top: 65px;
    }

    .footer-main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 65px;
      padding-bottom: 45px;
    }

    .footer-brand .brand-name {
      color: white;
    }

    .footer-brand .brand-subtitle {
      color: #aab5c4;
    }

    .footer-description {
      max-width: 490px;
      color: #b5c0ce;
      font-size: 13px;
      line-height: 2.6;
      margin-top: 22px;
    }

    .footer-info h3 {
      font-size: 15px;
      color: var(--gold-light);
      margin-bottom: 17px;
    }

    .footer-info p {
      color: #b5c0ce;
      font-size: 13px;
      line-height: 2.6;
      margin-bottom: 9px;
    }

    .footer-bottom {
      border-top: 1px solid rgba(255,255,255,.12);
      min-height: 75px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      color: #9ba9ba;
      font-size: 11px;
    }

    .footer-bottom span {
      color: var(--gold);
    }

    /* Responsive */

    @media (max-width: 900px) {
      .hero-inner {
        grid-template-columns: 1fr .65fr;
        gap: 30px;
        min-height: 480px;
        padding-block: 70px;
      }

      .emblem {
        width: 240px;
      }

      .emblem-symbol {
        font-size: 67px;
      }

      .emblem-name {
        font-size: 23px;
      }

      .services-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .about-grid {
        gap: 40px;
      }

      .about-visual {
        min-height: 350px;
        padding: 25px;
      }

      .promise-inner {
        padding: 35px;
        gap: 30px;
      }
    }

    @media (max-width: 640px) {
      .container {
        width: calc(100% - 36px);
      }

      .header-inner {
        min-height: 82px;
        gap: 10px;
      }

      .brand {
        gap: 10px;
      }

      .brand-mark {
        width: 41px;
        height: 41px;
        font-size: 22px;
        border-radius: 12px;
      }

      .brand-name {
        font-size: 24px;
      }

      .brand-subtitle {
        font-size: 9px;
        letter-spacing: .3px;
      }

      .header-note {
        font-size: 10px;
        text-align: left;
        line-height: 1.9;
        max-width: 105px;
      }

      .hero-inner {
        grid-template-columns: 1fr;
        text-align: center;
        padding-block: 65px 55px;
        gap: 42px;
      }

      .hero-copy {
        order: 1;
      }

      .hero-visual {
        order: 0;
      }

      .emblem {
        width: 205px;
        padding: 15px;
      }

      .emblem::before {
        inset: 9px;
      }

      .emblem-symbol {
        font-size: 57px;
      }

      .emblem-name {
        font-size: 22px;
      }

      .emblem-caption {
        font-size: 9px;
      }

      .eyebrow {
        justify-content: center;
        font-size: 11px;
        margin-bottom: 18px;
      }

      h1 {
        font-size: clamp(29px, 8vw, 39px);
        line-height: 1.8;
        letter-spacing: -.7px;
      }

      .hero-description {
        font-size: 13px;
        line-height: 2.5;
        margin-top: 17px;
      }

      .hero-note {
        justify-content: center;
        font-size: 11px;
        line-height: 2;
      }

      .trust-inner {
        grid-template-columns: 1fr;
        padding-block: 9px;
      }

      .trust-item {
        justify-content: flex-start;
        padding: 14px 5px;
      }

      .trust-item + .trust-item {
        border-right: none;
        border-top: 1px solid var(--border);
      }

      .section {
        padding-block: 68px;
      }

      .section-heading {
        margin-bottom: 30px;
      }

      h2 {
        font-size: 26px;
        line-height: 1.9;
      }

      .section-heading p {
        font-size: 13px;
      }

      .services-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .service-card {
        padding: 25px 23px;
        border-radius: 18px;
      }

      .service-card h3 {
        font-size: 16px;
      }

      .service-card p {
        font-size: 12px;
      }

      .about-grid {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .about-visual {
        min-height: 290px;
        padding: 30px;
        border-radius: 22px;
      }

      .about-visual .big-number {
        font-size: 54px;
      }

      .about-visual h3 {
        font-size: 20px;
      }

      .about-content > p {
        font-size: 13px;
      }

      .feature-list li {
        font-size: 12px;
      }

      .process-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .process-step {
        padding: 25px;
      }

      .promise {
        padding-block: 55px;
      }

      .promise-inner {
        grid-template-columns: 1fr;
        padding: 28px 23px;
        gap: 25px;
        border-radius: 21px;
      }

      .promise h2 {
        font-size: 25px;
      }

      .promise-quote {
        font-size: 13px;
        padding-right: 17px;
      }

      .footer-main {
        grid-template-columns: 1fr;
        gap: 35px;
        padding-bottom: 30px;
      }

      footer {
        padding-top: 45px;
      }

      .footer-description,
      .footer-info p {
        font-size: 12px;
      }

      .footer-bottom {
        padding-block: 20px;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 5px;
        line-height: 2;
      }
    }

    @media (max-width: 360px) {
      .container {
        width: calc(100% - 28px);
      }

      .brand-name {
        font-size: 21px;
      }

      .header-note {
        max-width: 88px;
        font-size: 9px;
      }

      .hero-inner {
        padding-block: 50px 45px;
      }

      h1 {
        font-size: 28px;
      }

      .service-card {
        padding: 22px 19px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="top-line"></div>

  <!-- Header -->
  <header>
    <div
