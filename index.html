<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHINEWS</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:#0f172a;
color:white;
overflow-x:hidden;
}

/* ===== LOADER ===== */

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:99999;
}

.loader-logo{
font-size:4rem;
font-weight:bold;
letter-spacing:8px;
color:#38bdf8;
animation:pulse 1.2s infinite;
}

.loading-bar{
width:250px;
height:6px;
background:#1e293b;
margin-top:20px;
border-radius:20px;
overflow:hidden;
}

.loading-fill{
height:100%;
width:0%;
background:#38bdf8;
animation:loading 2.5s linear forwards;
}

@keyframes loading{
from{width:0%;}
to{width:100%;}
}

@keyframes pulse{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.1);
}
}

#content{
display:none;
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* ===== MAIN ===== */

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
text-align:center;
padding:70px 20px;
}

.hero h1{
font-size:3.5rem;
margin-bottom:15px;
}

.hero p{
font-size:1.2rem;
color:#cbd5e1;
}

.video-container{
position:relative;
width:100%;
padding-bottom:56.25%;
overflow:hidden;
border-radius:20px;
margin-top:30px;
box-shadow:0 0 30px rgba(56,189,248,.3);
}

.video-container iframe{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.features{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:40px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:15px;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.price-box{
margin-top:50px;
background:#1e293b;
padding:30px;
border-radius:20px;
text-align:center;
}

.price{
font-size:3rem;
color:#22c55e;
margin:20px 0;
font-weight:bold;
}

.buy-btn{
display:inline-block;
padding:15px 40px;
background:#22c55e;
color:white;
text-decoration:none;
border-radius:12px;
font-size:18px;
}

.buy-btn:hover{
transform:scale(1.05);
}

.socials{
margin-top:50px;
text-align:center;
}

.socials a{
font-size:40px;
color:white;
margin:0 15px;
transition:.3s;
}

.socials a:hover{
color:#38bdf8;
}

footer{
margin-top:60px;
padding:20px;
text-align:center;
color:#94a3b8;
}

/* موبایل */

@media(max-width:768px){

.hero h1{
font-size:2.2rem;
}

.loader-logo{
font-size:2.5rem;
}

.price{
font-size:2rem;
}

.buy-btn{
width:100%;
}

}

</style>
</head>
<body>

<!-- LOADER -->

<div id="loader">

<div class="loader-logo">
ASHINEWS
</div>

<div class="loading-bar">
<div class="loading-fill"></div>
</div>

</div>

<!-- WEBSITE -->

<div id="content">

<div class="container">

<section class="hero">

<h1>پکیج حرفه‌ای efootball</h1>

<p>
با این اموزش تو دفاع کم نمیاری 👌
  با vpn وارد شو و ویدیو زیر ببین
</p>

</section>

<div class="video-container">

<iframe
src="https://www.youtube.com/embed/VIDEO_ID"
allowfullscreen>
</iframe>

</div>

<section class="features">

<div class="card">
<h3>یادگیری عمیق</h3>
</div>

<div class="card">
<h3>ارزون تر از همجا </h3>
</div>

<div class="card">
<h3>وپشتیبانی کامل</h3>
</div>

</section>

<div class="price-box">

<h2>قیمت با تخفیف ویژه</h2>

<div class="price">
250,000 تومان
</div>

<a href="#" class="buy-btn">
خرید
</a>

</div>

<div class="socials">

<a href="https://youtube.com/@ashi_news">
<i class="fab fa-youtube"></i>
</a>

<a href="https://t.me/ashinews">
<i class="fab fa-telegram"></i>
</a>

<a href="https://instagram.com/ashi_news">
<i class="fab fa-instagram"></i>
</a>

</div>

<footer>
© ASHINEWS
</footer>

</div>

</div>

<script>

window.onload = function(){

setTimeout(function(){

document.getElementById("loader").style.display = "none";

document.getElementById("content").style.display = "block";

},2500);

};

</script>

</body>
</html>
