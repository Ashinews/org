<h2>تعویض عکس حسن غفاری</h2>
<label>۱. فایل HTML سایتت را انتخاب کن:</label>
<input type="file" id="f" accept=".html,.htm,text/html">
<button class="btn" id="go">۲. عکس را عوض کن و فایل را بده</button>
<div id="st"></div></div>
<script>
var NEW='.ph-h{background-image:url('+document.getElementById('p').src+');background-size:cover;background-position:center}';
document.getElementById('go').onclick=function(){
 var st=document.getElementById('st'),f=document.getElementById('f').files[0];
 if(!f){st.style.color='#ff9a9a';st.textContent='اول فایل سایت را انتخاب کن.';return}
 var r=new FileReader();
 r.onload=function(){
  var t=r.result,n=0;
  t=t.replace(/\.ph-h\{background-image:url\([^)]*\)\}/g,function(){n++;return NEW});
  if(!n){t=t.replace('</style>',NEW+'\n</style>');n=1}
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));
  a.download='ashibaba-new.html';document.body.appendChild(a);a.click();
  st.style.color='#7dffb2';st.textContent='انجام شد ✓ فایل ashibaba-new.html ذخیره شد.';
 };
 r.readAsText(f,'UTF-8');
};
</script></body></html>
